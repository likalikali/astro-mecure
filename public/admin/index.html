<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>团子的书桌 · 内容管理</title><link rel="icon" href="/favicon-white-mochi.png"><link rel="stylesheet" href="/admin/style.css"><script type="module" src="/admin/app.js"></script></head>
<body>
<header><a href="/">团子のUtopia</a><span>我的书桌</span><button id="logout" hidden>退出登录</button></header>
<main>
<section id="loginPanel" class="login"><p class="eyebrow">WELCOME HOME</p><h1>写点什么吧。</h1><p id="loginHint">登录后，管理文章和关于页面。</p><form id="loginForm"><label for="password">管理员密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button class="primary" type="submit">进入书桌</button></form></section>
<p id="notice" role="status" aria-live="polite"></p>
<section id="workspace" hidden>
<aside><div class="tools"><h2>内容</h2><button id="new">＋ 新文章</button><button id="refresh">刷新</button></div><label for="search">搜索标题</label><input id="search" type="search" placeholder="找一篇文章……"><label for="filter">类型</label><select id="filter"><option value="all">全部内容</option><option value="page">关于 / 独立页面</option><option value="post">已发布文章</option><option value="draft">未发布草稿</option><option value="pending">已发布 · 待更新</option></select><p id="count"></p><p id="listStatus" role="status"></p><nav id="entries" aria-label="内容列表"></nav></aside>
<section id="editor"><div id="empty"><h1>从左边选择一篇内容</h1><p>或者新建一篇文章，把今天留下来。</p></div>
<form id="editForm" hidden>
<div class="editor-top"><div class="tools"><span id="kind"></span><span id="publication" class="badge"></span><a id="viewLive" target="_blank" rel="noopener" hidden>查看线上 ↗</a></div>
<div class="tools actions"><button id="delete" type="button" class="danger" hidden>删除文章</button><button id="saveDraft" type="button">暂存草稿</button><button id="publish" class="primary" type="button">发布文章</button></div>
<p id="dirty" role="status" aria-live="polite"></p><p id="stateHint" class="hint"></p>
<div id="feedback" role="status" aria-live="polite" hidden></div>
</div>
<label for="title">标题</label><input id="title" required maxlength="250">
<div id="postFields"><div class="grid"><label>创建时间<input id="createdDate" type="datetime-local" step="1"></label><label>首次上传时间<input id="date" type="datetime-local" step="1"></label><label>最后修改时间<input id="updateDate" type="datetime-local" step="1"></label></div><label class="check"><input id="autoModified" type="checkbox" checked>保存时自动更新最后修改时间</label><p class="hint">三个时间均按北京时间。新文章留空时自动填写，也可以自行指定。</p><div class="grid"><label>分类层级（用 / 分开）<input id="category" placeholder="生活 / 个人随笔"></label><label>标签（用逗号分开）<input id="tags" placeholder="日常，回忆"></label></div></div>
<div id="pageFields" hidden><label>页面简介<input id="description" maxlength="1000"></label><div class="tools"><label class="check"><input id="comment" type="checkbox">显示评论</label><label class="check"><input id="sidebar" type="checkbox">显示侧边栏</label></div></div>
<label for="body">正文 <span class="hint">支持 Markdown：## 小标题、**加粗**、[文字](链接)、![说明](图片地址)</span></label><p id="pageHint" class="hint" hidden>关于页的“三色团子入口”标记可移动，请保留标记，保存后会自动显示三个团子。</p><textarea id="body" spellcheck="false" placeholder="从这里开始写……"></textarea><p class="hint">Ctrl / ⌘ + S 暂存。只有点击“发布”才会更新公网；暂存修改不会改变线上版本。</p>
<div class="editor-bottom tools"><button id="reload" type="button">重新载入</button><button id="copyBody" type="button">复制正文</button><button id="discardDraft" type="button" hidden>放弃暂存修改</button><button id="withdraw" type="button" hidden>撤回发布</button></div>
</form>
</section></section>
</main><footer>慢慢写，慢慢记录。<a href="/" target="_blank" rel="noopener">打开博客 ↗</a></footer>
</body></html>
